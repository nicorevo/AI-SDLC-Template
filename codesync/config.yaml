# Codesync Configuration
# This file defines the service settings and project scanning options.

# Service configuration
service:
  host: "0.0.0.0"
  port: 9000
  cors_origins:
    - "*"

# Scanning configuration
scanner:
  # Comma-separated list of directories to always skip
  skip_dirs:
    - ".git"
    - "__pycache__"
    - "node_modules"
    - ".idea"
    - ".vscode"
    - ".metadata"
    - "target"
    - "dist"
    - "env"
    - ".environment"
    - "LOGS"
    - ".settings"
    - "temp"

  # Maximum file size to include (in bytes, default 500KB)
  max_file_size: 524288

  # Binary file extensions to skip
  binary_extensions:
    - ".class"
    - ".jar"
    - ".war"
    - ".exe"
    - ".app"
    - ".pyc"
    - ".pyo"
    - ".pyd"
    - ".so"
    - ".dll"
    - ".dylib"
    - ".o"
    - ".a"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".bmp"
    - ".ico"
    - ".svg"
    - ".webp"
    - ".mp4"
    - ".avi"
    - ".mov"
    - ".wmv"
    - ".flv"
    - ".tiff"
    - ".zip"
    - ".tar"
    - ".gz"
    - ".bz2"
    - ".7z"
    - ".rar"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".woff"
    - ".woff2"
    - ".ttf"
    - ".eot"
    - ".db"
    - ".sqlite"
    - ".sqlite3"
    - ".iml"
